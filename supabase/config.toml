# Supabase CLI config (functions that receive webhooks must not require a Supabase JWT)
[functions.submit-lead]
verify_jwt = false
[functions.whatsapp-webhook]
verify_jwt = false
[functions.razorpay-webhook]
verify_jwt = false
[functions.follow-up]
verify_jwt = false
[functions.payment-link]
verify_jwt = true

# Sign-in: admins only, by emailed 6-digit code or password. Emails go out through Resend from no-reply@mechanixpro.in.
# Apply with:  RESEND_API_KEY=<key> npx supabase config push   (only after the Resend domain is verified)
[auth]
enable_signup = false
site_url = "https://admin.mechanixpro.in"
additional_redirect_urls = ["https://mechanixpro-admin.pages.dev"]

[auth.email]
enable_signup = false
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Your Mechanix Pro login code"
content_path = "./supabase/templates/otp.html"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@mechanixpro.in"
sender_name = "Mechanix Pro"
