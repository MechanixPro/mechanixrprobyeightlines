# Sign-in: admins only, by emailed 6-digit code or password. Emails go out through Resend from no-reply@mechanixpro.in.
# Apply with:  RESEND_API_KEY=<key> npx supabase config push   (only after the Resend domain is verified)
[auth]
enable_signup = false
site_url = "https://admin.mechanixpro.in"
additional_redirect_urls = ["https://mechanixpro-admin.pages.dev"]

[auth.email]
# Keep this true: it switches the Email sign-in provider on (login codes and passwords). Public sign-ups are blocked by [auth] enable_signup = false above.
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Your Mechanix Pro login code"
content_path = "./supabase/templates/otp.html"

# Login codes are sent by our own function (functions/auth-email) through Resend, set up once as a Supabase Auth "Send Email" hook.
# The hook is deliberately not declared here: its secret must not live in this file, and declaring it would make every CLI command ask for it.
# See docs/AUTH-EMAIL.md.