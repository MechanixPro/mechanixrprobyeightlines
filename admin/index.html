<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mechanix Pro · Admin</title>
<link rel="icon" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/flow.css">
<link rel="stylesheet" href="/admin/funnel.css">
<link rel="stylesheet" href="/admin/ds.css">
<script src="/assets/js/config.js"></script>
<script type="module" src="/admin/admin.js"></script>
</head>
<body class="admin">
<header class="top">
  <button class="menu-btn" type="button" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="side"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="/admin/"><img src="/assets/img/logo.svg" alt="" width="26" height="29"><span>Mechanix Admin</span></a>
  <form class="gsearch" id="gsearch" role="search" hidden><input id="gq" type="search" placeholder="Search name, phone or booking ID" aria-label="Search bookings" autocomplete="off"></form>
  <div class="who" id="whoBox" hidden><span class="avatar" id="avatar" aria-hidden="true"></span><span id="who"></span><button class="btn ghost sm" type="button" id="signOut">Sign out</button></div>
</header>
<div class="shell-body">
  <aside class="side" id="side" aria-label="Menu">
    <nav class="groups" id="tabs" aria-label="Admin sections" hidden>
      <div class="grp"><button type="button" data-group="today" aria-current="page">Today</button><div class="sub" data-sub="today"><button type="button" data-tab="dash" aria-current="page">Dashboard</button><button type="button" data-tab="watch">Service Watch</button></div></div>
      <div class="grp"><button type="button" data-group="bookings">Bookings<span class="badge" data-badge="bookings" hidden></span><span class="badge badge-paid" data-badge="paidOpen" hidden title="Paid bookings waiting for a mechanic"></span></button><div class="sub" data-sub="bookings" hidden><button type="button" data-tab="board">Today board</button><button type="button" data-tab="dispatch">Dispatch</button><button type="button" data-tab="leads">Bookings</button><button type="button" data-tab="customers">Customers</button><button type="button" data-tab="custbook" hidden>Customer bookings</button><button type="button" data-tab="issues">Issues</button></div></div>
      <div class="grp"><button type="button" data-group="money">Money<span class="badge" data-badge="money" hidden></span></button><div class="sub" data-sub="money" hidden><button type="button" data-tab="sales">Sales and collections</button><button type="button" data-tab="mechledger">Mechanic ledgers</button><button type="button" data-tab="invoices">Invoices</button><button type="button" data-tab="conversion">Conversion</button><button type="button" data-tab="reports">Reports</button><button type="button" data-tab="coupons">Coupons</button><button type="button" data-tab="prices">Prices</button></div></div>
      <div class="grp"><button type="button" data-group="team">Team and areas</button><div class="sub" data-sub="team" hidden><button type="button" data-tab="mechanics">Mechanics</button><button type="button" data-tab="garageapp" hidden>Garage app</button><button type="button" data-tab="kyc" hidden>Partner KYC</button><button type="button" data-tab="pins">PIN codes</button></div></div>
      <div class="grp"><button type="button" data-group="more">More</button><div class="sub" data-sub="more" hidden><button type="button" data-tab="offers">Offers</button><button type="button" data-tab="waitlist">Waitlist</button><button type="button" data-tab="homeimgs">Home images</button><button type="button" data-tab="settings">Settings</button><button type="button" data-tab="activity">Activity</button></div></div>
    </nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
<main class="body" id="app">
  <div class="card login" id="login">
    <img src="/assets/img/logo.svg" alt="" width="48" height="53" style="margin:0 auto 12px">
    <h1 style="font-size:28px;text-align:center">Mechanix Pro Admin</h1>
    <form id="loginForm" novalidate>
      <label class="label" for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label class="label" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
      <button class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">Sign in</button>
      <button class="btn btn-ghost" style="width:100%;margin-top:10px" type="button" id="forgot">Forgot password?</button>
      <p class="small muted" id="loginInfo" style="margin:10px 0 0" role="status"></p>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
    <form id="resetForm" novalidate hidden>
      <h2 style="font-size:20px;margin:6px 0 4px">Choose a new password</h2>
      <p class="small muted" style="margin:0 0 6px">At least 10 characters. Use something you do not use anywhere else.</p>
      <label class="label" for="np1">New password</label><input id="np1" type="password" autocomplete="new-password" minlength="10">
      <label class="label" for="np2">Type it again</label><input id="np2" type="password" autocomplete="new-password" minlength="10">
      <button class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">Save and sign in</button>
      <p class="err" id="resetErr" role="alert"></p>
    </form>
    <p class="tiny muted" style="text-align:center;margin-top:14px">Protected by Supabase Auth and Cloudflare Access.</p>
  </div>
  <div id="view" hidden></div>
</main>
</div>
<nav class="bottombar" id="bottombar" aria-label="Shortcuts" hidden></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><div class="sheet-panel" id="sheetPanel"></div></div>
</body>
</html>
