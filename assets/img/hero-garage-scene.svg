<svg xmlns="http://www.w3.org/2000/svg" viewBox="-640 0 2240 900" width="2240" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
<title id="t">The Mechanix Pro garage</title>
<desc id="d">A designed illustration of a clean Mechanix Pro garage: a tool wall, a branded poster, shelves with helmets, navy cabinets, an open shutter with daylight, a silver scooter and a mechanic with a wrench.</desc>
<style>
.lampg{animation:lamp 5s ease-in-out infinite}.shaft{animation:shaft 9s ease-in-out infinite}.dust{animation:dust 10s linear infinite;opacity:0}.d2{animation-delay:3s}.d3{animation-delay:6s}.d4{animation-delay:8s}
@keyframes lamp{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shaft{0%,100%{opacity:.5}50%{opacity:.8}}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}20%{opacity:.7}100%{opacity:0;transform:translate(30px,-90px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dust{opacity:0}}
</style>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19305c"/><stop offset="1" stop-color="#0f1d3b"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a5c"/><stop offset=".5" stop-color="#1b2744"/><stop offset="1" stop-color="#101a31"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ec4f2"/><stop offset=".7" stop-color="#e6eefb"/><stop offset="1" stop-color="#fbe7c8"/></linearGradient>
<linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a74"/><stop offset="1" stop-color="#142a57"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9eef6"/><stop offset=".5" stop-color="#aab5c6"/><stop offset="1" stop-color="#78859b"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset="1" stop-color="#e86f10"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c9" stop-opacity=".95"/><stop offset="1" stop-color="#fff2c9" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7e0" stop-opacity=".55"/><stop offset="1" stop-color="#fff7e0" stop-opacity="0"/></linearGradient>
<pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="2" fill="#0d1a37" opacity=".7"/></pattern>
<pattern id="tile" width="160" height="60" patternUnits="userSpaceOnUse"><path d="M0 0H160M0 0V60" stroke="#3a4b72" stroke-width="2" opacity=".5" fill="none"/></pattern>
</defs>

