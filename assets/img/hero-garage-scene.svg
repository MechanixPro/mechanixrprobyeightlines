<svg xmlns="http://www.w3.org/2000/svg" viewBox="620 100 920 690" width="920" height="690" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">Mechanix Pro garage at dusk</title>
<desc id="d">A moody illustration of the Mechanix Pro garage at dusk: a glowing orange neon sign, a mechanic with a wrench beside a motorbike, both in silhouette against the warm light of an open shutter.</desc>
<style>
.neon{animation:neon 6s linear infinite}
.sun{animation:sun 8s ease-in-out infinite;transform-origin:1260px 560px}
.bulb{animation:bulb 4s ease-in-out infinite}.b2{animation-delay:1.3s}.b3{animation-delay:2.6s}
.ember{animation:ember 7s linear infinite;opacity:0}.e2{animation-delay:1.4s}.e3{animation-delay:2.8s}.e4{animation-delay:4.2s}.e5{animation-delay:5.6s}
.arm{animation:arm 2.4s ease-in-out infinite;transform-origin:800px 598px}
.w1{animation:spin 14s linear infinite;transform-origin:930px 722px}.w2{animation:spin 14s linear infinite;transform-origin:1430px 722px}
@keyframes neon{0%,19%,21%,60%,62%,100%{opacity:1}20%,61%{opacity:.78}}
@keyframes sun{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.04);opacity:1}}
@keyframes bulb{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}12%{opacity:.9}100%{opacity:0;transform:translate(40px,-220px)}}
@keyframes arm{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ember{opacity:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070d1c"/><stop offset=".45" stop-color="#0d1a38"/><stop offset="1" stop-color="#1a2a55"/></linearGradient>
<radialGradient id="dusk" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb55c"/><stop offset=".35" stop-color="#f2801f" stop-opacity=".85"/><stop offset=".7" stop-color="#b8431a" stop-opacity=".35"/><stop offset="1" stop-color="#14295a" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1f2e"/><stop offset=".25" stop-color="#121a33"/><stop offset="1" stop-color="#060b18"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb55c" stop-opacity="0"/><stop offset=".5" stop-color="#ffb55c"/><stop offset="1" stop-color="#ffb55c" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070d1c" stop-opacity=".95"/><stop offset=".55" stop-color="#070d1c" stop-opacity=".25"/><stop offset="1" stop-color="#070d1c" stop-opacity="0"/></linearGradient>
<linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb55c" stop-opacity=".35"/><stop offset="1" stop-color="#ffb55c" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

